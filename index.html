<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Datacenter MUS, racks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#eef9fd;--sf:#fff;--ink:#0b1b4d;--mute:#5d6b99;--line:#d3eaf4;--tile:#eef9fd;--blue:#00b7eb;--bt:#006f9c;--cy:#a8ecff;--chip:#dbf4fd;--chipink:#00638c;--okbg:#dff6ea;--okink:#0b7a4b;--sh:0 8px 28px rgba(0,120,170,.14);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06142a;--sf:#0d2140;--ink:#fff;--mute:#9fb8d6;--line:#1b3a62;--tile:#14305a;--bt:#6fd8ff;--chip:#17406c;--chipink:#9fe3ff;--okbg:#0f3b2c;--okink:#5be0a5;--sh:none}}
:root[data-theme="dark"]{--bg:#06142a;--sf:#0d2140;--ink:#fff;--mute:#9fb8d6;--line:#1b3a62;--tile:#14305a;--bt:#6fd8ff;--chip:#17406c;--chipink:#9fe3ff;--okbg:#0f3b2c;--okink:#5be0a5;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Outfit,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:12px 14px 48px}
nav{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:2px 14px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:9px 18px;border-radius:999px;background:var(--sf);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
nav a[aria-current="page"]{background:var(--blue);border-color:var(--blue);color:#04283a}
a:focus-visible{outline:3px solid var(--bt);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:28px;padding:26px 22px 24px;margin-bottom:18px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
.hero::before{width:230px;height:230px;right:-70px;top:-80px;background:rgba(255,255,255,.12)}
.hero::after{width:150px;height:150px;right:30px;bottom:-85px;background:#0093bf}
.hero::before,.hero::after{z-index:0}
.hero>*{position:relative;z-index:1}
.hero small{display:block;margin-top:18px;font-size:16px;font-weight:600;color:#04283a}
.logo{display:block;height:30px;width:auto}
.hero h1{margin:0;font-size:68px;line-height:1;font-weight:800;letter-spacing:-.02em}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.pills span{background:#fff;color:#00638c;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:600}
.card{background:var(--sf);border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px}
.ic{flex:none;width:42px;height:42px;border-radius:50%;background:var(--blue);color:#04283a;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.tp{font-size:14px;font-weight:600;color:var(--bt);line-height:1.25;overflow-wrap:anywhere}
.id{margin:2px 0 14px;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sec{font-size:20px;font-weight:800;margin:4px 2px 10px}
.idx{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.idx button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;font:inherit;cursor:pointer}
.idx button:focus-visible{outline:3px solid var(--bt);outline-offset:2px}
.idx .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#04283a;display:grid;place-items:center;font-weight:800}
.idx strong{display:block;font-weight:800;overflow-wrap:anywhere}
.idx small{display:block;color:var(--mute);font-size:13px}
.rack{position:relative;padding:0 22px}
.rack::before,.rack::after{content:"";position:absolute;top:0;bottom:0;width:12px;border-radius:6px;background:radial-gradient(circle,var(--bg) 2.6px,transparent 3px) center 0/12px 26px repeat-y,var(--blue)}
.rack::before{left:0}.rack::after{right:0}
.rack .card:last-child{margin-bottom:0}
.eqn{display:flex;width:fit-content;background:var(--blue);color:#04283a;font-weight:800;font-size:14px;padding:4px 14px;border-radius:999px;margin-bottom:14px}
.card{scroll-margin-top:12px}
.eq{margin-bottom:18px;border-radius:22px;background:var(--sf);border:1.5px solid var(--line);overflow:hidden;box-shadow:var(--sh);scroll-margin-top:12px;transition:border-color .3s,box-shadow .3s}
.eq.open{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,183,235,.28),var(--sh)}
.fb{display:block;width:100%;text-align:left;background:#0b1220;color:#e8efff;border:0;padding:14px 14px 12px;cursor:pointer;font:inherit}
.fb:focus-visible{outline:3px solid var(--cy);outline-offset:-3px}
.fh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.fc{font-size:19px;font-weight:800;overflow-wrap:anywhere;min-width:0}
.chev{margin-left:auto;flex:none;width:10px;height:10px;border-right:2.5px solid #9fb3e8;border-bottom:2.5px solid #9fb3e8;transform:rotate(45deg);transition:transform .3s}
.open .chev{transform:rotate(-135deg)}
.face svg{display:block;width:100%;height:auto;margin-top:12px}
.hint{display:block;margin-top:10px;font-size:13px;color:#9fb3e8}
.open .hint{display:none}
.ch{fill:#34333d;stroke:#1d1c22;stroke-width:1.2}
.sl{fill:#c9ccd4;stroke:#8d919d;stroke-width:.6}
.sl2{fill:#9a9eaa}
.ear{fill:#2a2931;stroke:#1d1c22;stroke-width:.8}
.chb{fill:#151518;stroke:#0a0a0c}
.bl{fill:#1c1c21;stroke:#34343b;stroke-width:.6}
.bd{fill:#26262c}
.dv{fill:#a5a7b0}
.gt{fill:#b7c94a}
.cn{fill:#d7d8de}
.yl{fill:#e8b923}
.bl2{fill:#0e0e11;stroke:#3a3a41;stroke-width:.6}
.bz3{fill:#101013;stroke:#2b2b31}
.vh{fill:#050507}
.lt{fill:#15151a}
.lc{fill:#1b8be0;stroke:#0e5a99;stroke-width:.5}
.dc{fill:#c9a24a;stroke:#8a6a22;stroke-width:.5}
.rd{fill:#e23a3a}
.cr{fill:#b4b8c3;stroke:#7a7e8c}
.tk{fill:#1b1b22;font:700 9px Outfit,system-ui,sans-serif;letter-spacing:.08em}
.tm{fill:#4a4d59;font:500 7.5px Outfit,system-ui,sans-serif}
.bz2{fill:#4c4858;stroke:#6a6578;stroke-width:.6}
.bw{fill:#f1f1f6;font:800 11px Outfit,system-ui,sans-serif;letter-spacing:.16em}
.wl{fill:#f4f4f6}
.wy{fill:#f2c23a}
.fr{fill:#25242c}
.pk2{fill:#101015;stroke:#3a3a46;stroke-width:.6}
.ft{fill:#26252d;stroke:#3f3e4b;stroke-width:.6}
.sc{fill:#0b1220;stroke:#55566a;stroke-width:.6}
.hl{fill:#8f94a1}
.mc{fill:#e3e5eb;stroke:#8d919d;stroke-width:.6}
.fan{fill:#17171c;stroke:#555563;stroke-width:.8}
.fh2{fill:#3c3c48}
.fv{stroke:#3c3c48;stroke-width:1;fill:none}
.vt2{stroke:#6b6f7c;stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.pt{fill:#15151b;stroke:#454552;stroke-width:.5}
.vt{stroke:#9a9eaa;stroke-width:1.6;stroke-linecap:round;fill:none}
.bz{fill:#00b7eb}
.bt{fill:#eceef4;font:700 9px Outfit,system-ui,sans-serif;letter-spacing:.08em}
.sm{fill:#c4c6d0;font:500 7.5px Outfit,system-ui,sans-serif}
.lg{fill:#34d399;animation:blink 2.6s ease-in-out infinite}
.off{fill:#4b5675}
@keyframes blink{50%{opacity:.4}}
@keyframes lit{0%{fill:#15151b;stroke:#454552}25%{fill:#19d3ff;stroke:#19d3ff}100%{fill:#15151b;stroke:#454552}}
.open .pt{animation:lit .9s calc(var(--i)*3ms) both}
.pn{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .45s ease,visibility 0s .45s}
.open .pn{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.pi{overflow:hidden;min-height:0}
.pb{padding:18px 18px 20px}
.pb .eqrow{margin-top:14px}
.rack .eq:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){.lg,.open .pt{animation:none}.pn,.chev,.eq{transition:none}}
.lb{display:block;font-style:normal;font-size:13px;color:var(--mute);font-weight:500}
.eqrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.spec{display:grid;gap:10px}
.sp{background:var(--chip);border-radius:16px;padding:10px 14px}
.sp em{display:block;font-style:normal;font-size:13px;color:var(--chipink);font-weight:600}
.sp strong{display:block;font-size:18px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .m{background:var(--chip);color:var(--chipink);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}
.row .o{font-weight:600;overflow-wrap:anywhere}
.bg{display:inline-flex;align-items:center;gap:6px;background:var(--okbg);color:var(--okink);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}
.bg i{width:8px;height:8px;border-radius:50%;background:currentColor}
.bg.off{background:var(--tile);color:var(--mute)}
.tag{display:inline-block;margin-top:12px;background:var(--cy);color:#04283a;padding:4px 14px;border-radius:999px;font-size:14px;font-weight:600}
.g{display:grid;gap:10px;margin-top:16px}
.t{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:18px;padding:12px 14px}
.t svg{flex:none;width:24px;height:24px;color:var(--bt)}
.t em{display:block;font-style:normal;font-size:13px;color:var(--mute)}
.t strong{display:block;white-space:nowrap;font-size:21px;line-height:1.15;font-weight:800}
.fn{margin-top:16px;padding-left:14px;border-left:4px solid var(--blue)}
.fn em{display:block;font-style:normal;font-size:13px;color:var(--mute)}
.fn p{margin:2px 0 0}
.msg{margin:6px 4px;font-size:17px;color:var(--mute)}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home a{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh);border-radius:24px;padding:18px;color:var(--ink);text-decoration:none}
.home b{font-size:36px;line-height:1.05;font-weight:800}
.home span{font-size:14px;color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
.home u{margin-top:14px;align-self:flex-start;text-decoration:none;background:var(--blue);color:#04283a;padding:6px 16px;border-radius:999px;font-size:14px;font-weight:600}
.home a:active{background:var(--tile)}
</style>
